<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tactics Game POC</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
</head>
<body>
<div id="wrap">
  <div id="ui">
    <div id="status">Turn: -</div>
    <button id="wait">Wait / Skip Action</button>
    <button id="endTurn">End Turn</button>
    <button id="reset">Reset</button>
    <button id="music">&#9835; Music: ON</button>
    <label id="volWrap" title="Music volume">
      <span id="volIcon">&#128266;</span>
      <input id="volume" type="range" min="0" max="100" value="40" />
    </label>
  </div>
  <midi-player id="midiPlayer" src="assets/floating_gardens.mid" sound-font loop style="display:none;"></midi-player>
  <canvas id="canvas" width="1060" height="560"></canvas>
  <div class="hint">
    Click your unit (yellow outline) &rarr; click a blue tile to move &rarr; click an enemy in red range to attack, or click your unit / Wait to skip. Right-click cancels.
  </div>
  <div id="log"></div>
</div>
<script src="game.js"></script>
</body>
</html>
